## rosdoc2 configuration; see https://github.com/ros-infrastructure/rosdoc2.
## The package installs no headers, so there is no C++ API to document.
type: rosdoc2 config
version: 1


# rosdoc2 reads two YAML documents from this file.
# yamllint disable-line rule:document-start
---
settings:
  generate_package_index: true
  always_run_doxygen: false
  always_run_sphinx_apidoc: false
builders:
  - sphinx:
      name: rosbag_recorder
      output_dir: ""
