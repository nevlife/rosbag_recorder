# SCV Logger recording profile. Saving from the GUI (profile tab) rewrites this file.
# With extends naming a parent, only the differences from the parent are written.
name: localization_eval
description: localization rerun and evaluation with IMU, GNSS, LiDAR packets, wheel odometry, TF, localization output
extends: base
add_groups:
  - lidar
  - imu_gnss
  - vehicle
  - localization
  - control
  - tf
