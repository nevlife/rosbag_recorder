# SCV Logger recording profile. Saving from the GUI (profile tab) rewrites this file.
# With extends naming a parent, only the differences from the parent are written.
name: planning_tuning
description: parameter tuning loops with pose, path, behavior, control, vehicle state, costmap only (no raw sensors, very small)
extends: base
groups:
- vehicle
- localization
- planning
- control
- tf
options:
  split_duration_sec: 600
