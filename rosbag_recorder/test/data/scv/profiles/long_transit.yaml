# SCV Logger recording profile. Saving from the GUI (profile tab) rewrites this file.
# With extends naming a parent, only the differences from the parent are written.
name: long_transit
description: long stretches such as indoor↔outdoor moves; drive_standard without cameras, zstd compression
extends: drive_standard
exclude_groups:
  - camera_compressed
  - camera_info
options:
  compression: zstd
  split_duration_sec: 600
