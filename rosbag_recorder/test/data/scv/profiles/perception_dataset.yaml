# SCV Logger recording profile. Saving from the GUI (profile tab) rewrites this file.
# With extends naming a parent, only the differences from the parent are written.
name: perception_dataset
description: training and labeling data with raw cameras, LiDAR packets (points converted after recording), TF, pose (very large)
extends: base
add_groups:
  - lidar_points
  - camera_info
  - camera_compressed
  - imu_gnss
  - vehicle
  - control
  - tf
topics:
  - /front/scan
  - /rear/scan
options:
  split_duration_sec: 120
