# SCV Logger recording profile. Saving from the GUI (profile tab) rewrites this file.
# With extends naming a parent, only the differences from the parent are written.
name: drive_standard
description: regular autonomous driving test with LiDAR packets, compressed cameras, sensors, pose, planning, control, vehicle state, TF
extends: base
groups:
  - lidar
  - camera_info
  - camera_compressed
  - imu_gnss
  - vehicle
  - localization
  - planning
  - control
  - tf
